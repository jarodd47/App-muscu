<script>
const K='muscu_v1',$=id=>document.getElementById(id),uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let S;try{S=JSON.parse(localStorage.getItem(K))}catch(e){}
S=S||{ex:[],ses:[],hist:[],act:null,rest:90,bw:[]};
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
try{navigator.storage.persist()}catch(e){}
const CAT={
'Pecs':{'Développé couché':'barre,haltères,machine,Smith','Développé incliné':'haltères,barre,machine,Smith','Développé décliné':'barre,machine','Développé convergent':'machine','Écartés':'haltères,câble,machine','Écartés inclinés':'haltères,câble','Croisés poulies':'câble haute,câble basse','Pompes':'poids du corps,lestées','Dips pecs':'poids du corps,machine'},
'Dos':{'Tractions':'poids du corps,machine assistée,lestées','Tractions supination':'poids du corps,machine assistée','Tirage vertical':'câble,machine','Tirage poitrine prise serrée':'câble','Rowing':'barre,haltère,machine,câble,T-bar','Rowing Pendlay':'barre','Tirage horizontal':'câble','Pull-down bras tendus':'câble','Soulevé de terre':'barre,trap bar,sumo','Rack pull':'barre','Hyperextensions':'banc,lesté','Pull-over':'câble,haltère','Shrugs':'haltères,barre,machine'},
'Épaules':{'Développé épaules':'haltères,barre,machine,Smith','Développé militaire':'barre','Arnold press':'haltères','Élévations latérales':'haltères,câble,machine','Élévations frontales':'haltères,câble,barre','Oiseau':'haltères,câble,machine','Face pull':'câble','Tirage menton':'barre,câble,haltères'},
'Biceps':{'Curl':'barre,haltères,câble,machine','Curl marteau':'haltères,câble','Curl incliné':'haltères','Curl pupitre':'barre EZ,machine,haltère','Curl concentration':'haltère','Curl araignée':'barre EZ,haltères','Curl inversé':'barre EZ,câble'},
'Triceps':{'Extension triceps':'câble,haltère,barre EZ','Pushdown':'câble corde,câble barre','Barre au front':'barre EZ,haltères','Développé couché serré':'barre,Smith','Dips':'poids du corps,machine','Dips banc':'poids du corps','Kickback':'câble,haltère'},
'Avant-bras':{'Curl poignets':'barre,haltères','Curl poignets inversé':'barre','Farmer walk':'haltères'},
'Jambes':{'Squat':'barre,Smith,hack machine,goblet haltère','Front squat':'barre','Squat bulgare':'haltères,Smith','Presse à cuisses':'machine,unilatérale machine','Fentes':'haltères,barre,Smith','Fentes marchées':'haltères','Step-up':'haltères','Leg extension':'machine','Leg curl':'machine assis,machine couché','Soulevé de terre roumain':'barre,haltères','Good morning':'barre','Hip thrust':'barre,machine','Glute kickback':'câble,machine','Nordic curl':'poids du corps','Mollets':'machine debout,machine assise,presse,haltère unilatéral','Adducteurs':'machine','Abducteurs':'machine','Extension lombaires':'machine'},
'Abdos':{'Crunch':'câble,machine,poids du corps','Relevé de jambes':'poids du corps,chaise romaine','Relevé de genoux':'chaise romaine','Gainage':'poids du corps','Rotation russe':'poids du corps,haltère','Woodchopper':'câble','Pallof press':'câble','Roue abdominale':'roue'}};
const eqOf=v=>/câble/i.test(v)?'Câble':/machine|presse|hack|smith/i.test(v)?'Machine':/corps|romaine|banc/i.test(v)?'Poids du corps':'Poids libre',
EQ=['Poids libre','Machine','Câble','Poids du corps'],GR=[...Object.keys(CAT),'Autre'],
OLD={'Développé couché':'Développé couché (barre)','Développé incliné':'Développé incliné (haltères)','Développé épaules':'Développé épaules (haltères)','Dips':'Dips (poids du corps)','Tractions':'Tractions (poids du corps)','Rowing barre':'Rowing (barre)','Squat':'Squat (barre)','Soulevé de terre':'Soulevé de terre (barre)','Presse à cuisses':'Presse à cuisses (machine)'};
function sync(){for(const g in CAT)for(const b in CAT[g])CAT[g][b].split(',').forEach(v=>{const n=`${b} (${v})`;let e=S.ex.find(x=>x.n===n);if(!e)S.ex.push(e={id:uid(),n});e.g=g;e.eq=eqOf(v)});S.ex.forEach(e=>{e.g=e.g||'Autre';e.eq=e.eq||'Poids libre'})}
if(!S.v){
 S.ex.forEach(e=>{if(OLD[e.n])e.n=OLD[e.n];else e.c=1});
 sync();
 S.ex.forEach(e=>{e.g=e.g||'Autre';e.eq=e.eq||'Poids libre'});
 if(!S.ses.length){const g=x=>S.ex.find(e=>e.n===x).id,m=(n,l)=>({id:uid(),n,it:l.map(([x,c])=>({ex:g(x),s:Array(c).fill('t')}))});
  S.ses=[m('Push',[['Développé couché (barre)',4],['Développé incliné (haltères)',3],['Développé épaules (haltères)',3],['Dips (poids du corps)',3]]),m('Pull',[['Tractions (poids du corps)',4],['Rowing (barre)',4]]),m('Legs',[['Squat (barre)',4],['Presse à cuisses (machine)',3],['Soulevé de terre (barre)',3]])]}
 S.ses.forEach(s=>s.it.forEach(i=>{if(!i.s)i.s=Array(i.n||3).fill('t')}));
 S.u='kg';S.v=2;save()}
sync();save();
const F=2.20462,dsp=k=>Math.round((S.u==='lb'?k*F:k)*10)/10,kg=v=>S.u==='lb'?v/F:v,U=()=>S.u==='lb'?'lb':'kg',STEP=()=>S.u==='lb'?5:2.5;
let V={p:S.act?'work':'home'},AR=null,T=0,AC;
const exN=id=>(S.ex.find(e=>e.id===id)||{}).n,
fd=(t,l)=>new Date(t).toLocaleDateString('fr-FR',l?{weekday:'long',day:'numeric',month:'long'}:{day:'numeric',month:'short'}),
vol=ent=>ent.reduce((a,e)=>a+e.sets.reduce((b,s)=>b+(s.d&&s.t!=='e'?s.w*s.r:0),0),0),
cur=()=>S.ses.find(x=>x.id===V.x);
function conf(k,fn){if(AR===k){AR=null;fn()}else{AR=k;render();setTimeout(()=>{if(AR===k){AR=null;render()}},3000)}}
function go(p,x){V={p,x};render(1)}
function nextS(){if(!S.ses.length)return null;const l=[...S.hist].reverse().find(h=>h.sid),i=l?S.ses.findIndex(s=>s.id===l.sid):-1;return S.ses[(i+1)%S.ses.length]}
function lastOf(ex){for(let i=S.hist.length-1;i>=0;i--){const e=S.hist[i].ent.find(x=>x.ex===ex);if(e&&e.sets.length)return e.sets}return null}
function mkEnt(ex,ty,rg,ss){rg=rg||'8-12';const[lo,hi]=rg.split('-').map(Number),L=lastOf(ex),W=L&&L.filter(s=>s.t!=='e'),up=!!(W&&W.length&&W.every(s=>s.r>=hi&&s.w>0)),o=[];
 ty.forEach((t,i)=>{const p=L?(L[i]||L[L.length-1]):null;let w=p?p.w:0,r=p?p.r:lo;
  if(up&&t!=='e'){w=kg(dsp(w)+STEP());r=lo}
  if(t==='d'&&o.length){const q=o[o.length-1];w=kg(Math.max(0,Math.round(dsp(q.w)*.8/STEP())*STEP()));r=q.r}
  o.push({w,r,d:0,t,rt:(p&&p.rt)||S.rest,df:0,ri:-1})});
 return{ex,n:exN(ex),rg,ss:ss?1:0,sg:up?1:0,sets:o}}
function start(id){const s=S.ses.find(x=>x.id===id);if(!s||!s.it.length)return;S.act={sid:id,n:s.n,t:Date.now(),ent:s.it.map(it=>mkEnt(it.ex,it.s,it.rg,it.ss))};if(S.act.ent[0]&&S.act.ent[0].sets[0]&&S.act.ent[0].sets[0].w>0){const w=dsp(S.act.ent[0].sets[0].w);S.act.ent[0].sets.unshift(...[[.5,8],[.7,5],[.85,3]].map(([f,r])=>({w:kg(Math.max(STEP(),Math.round(w*f/STEP())*STEP())),r,d:0,t:'e',rt:45,df:0,ri:-1})));}save();go('work')}
/* ---- écrans ---- */
const COL=['#e5605a','#5ec97b','#f0b34a','#7aa7ff','#b48cf2','#4fd1c5'];
function home(){const n=nextS(),F={};S.ses.forEach(s=>(F[s.f||'']=F[s.f||'']||[]).push(s));
 const row=s=>`<div class=rt style="--c:${COL[(s.c||0)%6]}"><i></i><div style="flex:1" onclick="go('edit','${s.id}')"><b>${esc(s.n)}</b><div class=lb>${s.it.length} exos · ${s.it.reduce((a,i)=>a+i.s.length,0)} séries${s===n?' · prochaine':''}</div></div><button class=gp onclick="go('edit','${s.id}')">⋯</button><button class=go onclick="start('${s.id}')">Démarrer</button></div>`;
 return `<div class=lb style="color:var(--ac)">● Aujourd’hui</div><h1>Routines</h1>`+(S.act?`<button class=pri onclick="go('work')">Reprendre : ${esc(S.act.n)}</button>`:`<div class=row><button class=pri onclick="startEmpty()">▶ Séance vide<br><small class=lb style="color:var(--on)">Démarre sans plan</small></button><button class=pl onclick="newS()">+<br><small class=lb>Routine</small></button></div>`)
 +'<div class=lb style="margin:16px 0 2px">Mes dossiers</div>'+Object.keys(F).sort().map(f=>`<details open><summary>${esc(f||'Sans dossier')} <span class=lb>· ${F[f].length} routines</span></summary>${F[f].map(row).join('')}</details>`).join('')}
